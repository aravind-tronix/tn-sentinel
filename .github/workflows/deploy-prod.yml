name: Deploy — Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Lambda ZIP
        run: |
          BUILD_DIR=/tmp/lambda_pkg
          mkdir -p $BUILD_DIR
          pip install fastapi mangum boto3 --target $BUILD_DIR -q
          cp aws/*.py $BUILD_DIR/
          cd $BUILD_DIR
          zip -r /tmp/lambda.zip . -x "*.pyc" -x "*/__pycache__/*"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Deploy to Lambda (production)
        run: |
          aws lambda update-function-code \
            --function-name tn-sentinel-api-prod \
            --zip-file fileb:///tmp/lambda.zip \
            --region ap-south-1

          aws lambda update-function-code \
            --function-name tn-sentinel-websocket-prod \
            --zip-file fileb:///tmp/lambda.zip \
            --region ap-south-1

      - name: Wait for update to complete
        run: |
          aws lambda wait function-updated \
            --function-name tn-sentinel-api-prod \
            --region ap-south-1
